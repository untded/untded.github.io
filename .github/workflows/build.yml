name: build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Internal link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir ./dist 'dist/**/*.html'
          fail: true
